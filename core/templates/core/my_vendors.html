<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>My Vendor Services</h2>

<a href="{% url 'add_vendor' %}">Add New Service</a>

<ul>
  {% for vendor in vendors %}
    <li>
      <strong>{{ vendor.service_name }}</strong> — {{ vendor.price }}
      |
      <a href="{% url 'edit_vendor' vendor.id %}">Edit</a>
      |
      <a href="{% url 'delete_vendor' vendor.id %}">Delete</a>
    </li>
  {% empty %}
    <li>No services added yet.</li>
  {% endfor %}
</ul>

</body>
</html>
